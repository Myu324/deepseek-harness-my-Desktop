<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>插件市场 — DeepSeek Harness</title>
  <link rel="stylesheet" href="market.css" />
</head>
<body>
  <header>
    <h1 id="page-title">插件市场</h1>
    <div class="subtitle">
      <button id="webview-back" class="nav" title="后退">←</button>
      <button id="webview-home" class="nav" title="返回主页">主页</button>
      <span id="engine-label">引擎</span> <code id="engine-version">…</code> ·
      <select id="lang" title="语言 / Language">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
      <button id="restart-app" class="danger">重启客户端</button>
    </div>
  </header>
  <div id="chips"></div>
  <webview id="community" src="about:blank" partition="persist:community"></webview>
  <section id="terminal">
    <div id="terminal-output" aria-live="polite"></div>
    <form id="terminal-form">
      <span class="prompt">$</span>
      <input id="terminal-input" autocomplete="off" spellcheck="false" placeholder="输入插件命令：add @linxin666/dsh-ssh" />
    </form>
    <div id="terminal-hint"></div>
  </section>
  <script src="market.js"></script>
</body>
</html>
