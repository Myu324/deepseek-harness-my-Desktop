<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #16181d;
      color: #e6e8ee;
      font: 15px/1.7 system-ui, "Segoe UI", sans-serif;
      text-align: center;
    }
    .box { max-width: 30em; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .spin {
      width: 28px;
      height: 28px;
      margin: 0 auto 16px;
      border: 3px solid #2b2f3a;
      border-top-color: #4c7dff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 8px 0; color: #9aa0ad; }
    .en { font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>DeepSeek Harness</h1>
    <p>正在下载引擎组件（首次运行，通常需要几分钟）。请保持应用开启，完成后会自动进入主界面。</p>
    <p class="en">Downloading the engine on first run — this usually takes a few minutes. Keep the app open; the main window appears automatically.</p>
  </div>
</body>
</html>
